# render.yaml — 1-Click 24/7 Cloud Deployment Blueprint for Build-BD Marketplace
# Deploy at $0/month on Render Free Tier (Singapore region, ~38ms to Dhaka)
# without ever needing your local Windows PC or ngrok running.
#
# Usage:
#   1. Go to https://dashboard.render.com -> New -> Blueprint
#   2. Select mushfiqarnab/build-bd-marketplace (branch: main)
#   3. Paste your existing MongoDB Atlas URI, Treasury Phone, and optional
#      Upstash Redis / Cloudflare R2 / BD SMS token when prompted.

services:
  - type: web
    name: build-bd-marketplace
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npm run build:frontend
    startCommand: node server.js
    healthCheckPath: /health/liveness
    envVars:
      - key: NODE_ENV
        value: production
      - key: BIND_ADDRESS
        value: 0.0.0.0
      - key: PORT
        value: 10000
      # Cryptographic 256-bit secrets auto-generated by Render
      - key: JWT_SECRET
        generateValue: true
      - key: BID_SEAL_SECRET
        generateValue: true
      - key: AUDIT_HMAC_SECRET
        generateValue: true
      - key: STORAGE_LOCAL_SECRET
        generateValue: true
      - key: TELECOM_WEBHOOK_SECRET
        generateValue: true
      # Core database & cache (reuse your existing Atlas M0 & Upstash URIs from .env.beta)
      - key: MONGODB_URI
        sync: false
      - key: REDIS_URL
        sync: false
      # Zero-Cost Manual MFS Escrow (bKash / Nagad / Rocket TrxID verification)
      - key: PAYMENT_GATEWAY_MODE
        value: manual_mfs
      - key: TREASURY_PHONE
        sync: false
      # Pluggable Bangladeshi SMS Gateway + ৳0 Cloud Operator Fallback
      - key: OTP_DELIVERY
        value: sms_or_operator
      - key: SMS_PROVIDER
        value: bulksmsbd
      - key: SMS_API_TOKEN
        sync: false
      - key: SMS_SENDER_ID
        value: "8809617611000"
      # Optional ৳0 Telegram Bot notification for fallback OTPs on your phone
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Storage: defaults to 'local' so Day-1 deploy boots immediately at $0;
      # switch STORAGE_PROVIDER to 'r2' once Cloudflare R2 (10GB free) keys are filled in.
      - key: STORAGE_PROVIDER
        value: local
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Platform & AI defaults
      - key: AI_ENGINE_MODE
        value: deterministic
      - key: EMI_BANKS_CATALOG_ENABLED
        value: "true"
