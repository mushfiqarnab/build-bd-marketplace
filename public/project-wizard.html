<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Build-BD — Post a job</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&display=swap" />
  <!-- React + Babel are intentionally CDN-loaded; this page is dev-only (NODE_ENV!=production). -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #0f172a; --surface: #1e293b; --surface2: #263346;
      --accent: #3b82f6; --accent2: #22d3ee; --danger: #ef4444;
      --success: #22c55e; --warn: #f59e0b;
      --text: #f1f5f9; --muted: #94a3b8; --border: #334155;
      --radius: 10px; --touch: 48px;
      --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent2);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans Bengali', sans-serif;
      font-size: 15px; min-height: 100dvh; -webkit-text-size-adjust: 100%;
    }
    body { padding: 20px 16px; display: flex; justify-content: center; }
    :lang(bn), [lang="bn"] { font-family: 'Noto Sans Bengali', system-ui, -apple-system, sans-serif; }
    #wizard-mount { width: 100%; max-width: 600px; }
    button:focus-visible, textarea:focus-visible {
      outline: none; box-shadow: var(--focus-ring);
    }
    .tile:focus-visible, .btn:focus-visible {
      outline: none; box-shadow: var(--focus-ring);
    }
  </style>
</head>
<body>

  <div id="wizard-mount"></div>

  <!-- Raw JS Component mapping since ES6 modules aren't supported on CDN sandbox -->
  <script type="text/babel">
    const { useState, useCallback } = React;

    const WIZARD_CATEGORIES = [
      { id: 'Residential', labelBn: 'আবাসিক ভবন (বাড়ি)', labelEn: 'Residential House/Building' },
      { id: 'Commercial', labelBn: 'বাণিজ্যিক ভবন (দোকান/অফিস)', labelEn: 'Commercial Shop/Office' },
      { id: 'Infrastructure', labelBn: 'রাস্তা/ড্রেন/ভিত্তি', labelEn: 'Roads/Drains/Foundations' },
      { id: 'Interior', labelBn: 'ভেতরের ডেকোরেশন (ইন্টেরিয়র)', labelEn: 'Interior Decoration' },
      { id: 'Renovation', labelBn: 'মেরামত বা সংস্কার কাজ', labelEn: 'Repair or Renovation' }
    ];

    const WIZARD_LOCATIONS = [
      { id: 'Dhaka', labelBn: 'ঢাকা', labelEn: 'Dhaka District' },
      { id: 'Chittagong', labelBn: 'চট্টগ্রাম', labelEn: 'Chittagong District' },
      { id: 'Sylhet', labelBn: 'সিলেট', labelEn: 'Sylhet District' },
      { id: 'Khulna', labelBn: 'খুলনা', labelEn: 'Khulna District' },
      { id: 'Rajshahi', labelBn: 'রাজশাহী', labelEn: 'Rajshahi District' }
    ];

    const WIZARD_PRIORITIES = [
      { id: 'LOW', labelBn: 'জরুরি নয় (বাজেট কম)', labelEn: 'Not urgent (lower budget)' },
      { id: 'MEDIUM', labelBn: 'মাঝারি জরুরি (স্বাভাবিক)', labelEn: 'Medium (standard)' },
      { id: 'HIGH', labelBn: 'খুবই জরুরি (দ্রুত কাজ শুরু)', labelEn: 'Highly urgent (fast track)' }
    ];

    const STEPS = {
      CATEGORY: 'CATEGORY',
      LOCATION: 'LOCATION',
      SCOPE: 'SCOPE',
      PRIORITY: 'PRIORITY',
      SUCCESS: 'SUCCESS'
    };

    // Colors are read from the CSS custom properties on :root so the wizard
    // stays in lockstep with public/index.html's theme.
    const V = (name) => `var(${name})`;
    const styles = {
      container: {
        padding: '18px',
        backgroundColor: V('--surface'),
        border: `1px solid ${V('--border')}`,
        borderRadius: V('--radius'),
        boxShadow: '0 10px 30px rgba(0,0,0,0.35)'
      },
      titleBn: { fontSize: '20px', fontWeight: 700, color: V('--accent2'), margin: '0 0 4px 0', textAlign: 'center' },
      titleEn: { fontSize: '13px', color: V('--muted'), margin: '0 0 16px 0', textAlign: 'center' },
      progressTrack: {
        width: '100%', height: '6px',
        backgroundColor: V('--surface2'),
        borderRadius: '3px', overflow: 'hidden', marginBottom: '20px'
      },
      progressBar: { height: '100%', backgroundColor: V('--accent2'), transition: 'width 0.3s ease' },
      promptBn: { fontSize: '16px', fontWeight: 700, color: V('--text'), margin: '0 0 4px 0' },
      promptEn: { fontSize: '13px', color: V('--muted'), margin: '0 0 16px 0' },
      grid: { display: 'grid', gridTemplateColumns: '1fr', gap: '10px', marginBottom: '20px' },
      tile: {
        width: '100%', minHeight: 'var(--touch)', padding: '12px 16px',
        borderRadius: '8px', textAlign: 'left', cursor: 'pointer',
        outline: 'none', transition: 'background-color .15s, border-color .15s'
      },
      tileBn: { fontSize: '15px', fontWeight: 700, marginBottom: '2px' },
      tileEn: { fontSize: '12px' },
      textarea: {
        width: '100%', padding: '12px', fontSize: '15px',
        borderRadius: '8px', border: `1px solid ${V('--border')}`,
        backgroundColor: V('--surface2'), color: V('--text'),
        outline: 'none', boxSizing: 'border-box', marginBottom: '6px', resize: 'vertical',
        fontFamily: "'Noto Sans Bengali', system-ui, -apple-system, sans-serif"
      },
      charCounter: { fontSize: '12px', color: V('--muted'), marginBottom: '20px' },
      errorHud: {
        backgroundColor: 'rgba(239,68,68,0.12)',
        borderLeft: `4px solid ${V('--danger')}`,
        padding: '12px', borderRadius: '6px', marginBottom: '16px'
      },
      errorText: { fontSize: '13px', color: '#fecaca', fontWeight: 600 },
      actionBar: { display: 'flex', justifyContent: 'space-between', gap: '12px', marginTop: '24px' },
      btnPrimary: {
        flex: 1, minHeight: 'var(--touch)', backgroundColor: V('--accent'),
        color: '#fff', fontWeight: 700, fontSize: '15px', border: 'none',
        borderRadius: V('--radius'), cursor: 'pointer'
      },
      btnSecondary: {
        padding: '0 16px', minHeight: 'var(--touch)',
        backgroundColor: 'transparent', color: V('--accent'),
        border: `1.5px solid ${V('--accent')}`,
        fontWeight: 600, fontSize: '14px', borderRadius: V('--radius'), cursor: 'pointer'
      },
      btnSubmit: {
        flex: 1, minHeight: 'var(--touch)', backgroundColor: V('--success'),
        color: '#fff', fontWeight: 700, fontSize: '15px', border: 'none',
        borderRadius: V('--radius'), cursor: 'pointer'
      },
      successCard: { textAlign: 'center', padding: '24px 16px' },
      successIcon: {
        width: '64px', height: '64px', lineHeight: '64px', borderRadius: '32px',
        backgroundColor: 'rgba(34,197,94,0.15)', color: V('--success'),
        fontSize: '32px', margin: '0 auto 16px auto', fontWeight: 700
      },
      successTitleBn: { fontSize: '22px', fontWeight: 700, color: V('--success'), margin: '0 0 4px 0' },
      successTitleEn: { fontSize: '15px', color: V('--muted'), margin: '0 0 24px 0' },
      matchHud: {
        backgroundColor: V('--surface2'),
        border: `1px solid ${V('--border')}`,
        borderRadius: '12px', padding: '20px 16px', marginBottom: '24px'
      },
      matchNumber: { fontSize: '48px', fontWeight: 900, color: V('--accent2'), marginBottom: '8px', lineHeight: 1 },
      matchLabelBn: { fontSize: '14px', fontWeight: 700, color: V('--text'), marginBottom: '4px' },
      matchLabelEn: { fontSize: '12px', color: V('--muted') },
      successNoteBn: { fontSize: '13px', color: V('--text'), lineHeight: 1.5, marginBottom: '4px' },
      successNoteEn: { fontSize: '12px', color: V('--muted'), lineHeight: 1.5 }
    };

    function App() {
      const [step, setStep] = useState(STEPS.CATEGORY);
      const [formData, setFormData] = useState({
        category: '',
        location: '',
        scopeDescription: '',
        priority: '',
        siteCoordinates: null
      });
      const [gpsStatus, setGpsStatus] = useState(null); // null | 'locating' | 'success' | 'error'
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [error, setError] = useState(null);
      const [matchCount, setMatchCount] = useState(0);

      const handleGetLocation = () => {
        if (!navigator.geolocation) {
          setError('ব্রাউজারে GPS সাপোর্ট নেই / Geolocation is not supported by your browser.');
          return;
        }
        setGpsStatus('locating');
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const coords = {
              latitude: Number(pos.coords.latitude.toFixed(6)),
              longitude: Number(pos.coords.longitude.toFixed(6))
            };
            setFormData((prev) => ({ ...prev, siteCoordinates: coords }));
            setGpsStatus('success');
          },
          (err) => {
            setGpsStatus('error');
            console.warn('Geolocation capture error:', err.message);
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
        );
      };

      const validateCurrentStep = () => {
        if (step === STEPS.CATEGORY && !formData.category) {
          setError('দয়া করে কাজের ধরন সিলেক্ট করুন / Please select a work type.');
          return false;
        }
        if (step === STEPS.LOCATION && !formData.location) {
          setError('দয়া করে জেলা সিলেক্ট করুন / Please select your district.');
          return false;
        }
        if (step === STEPS.SCOPE) {
          if (formData.scopeDescription.trim().length < 20) {
            setError('কাজের বিবরণ কমপক্ষে ২০ অক্ষরের হতে হবে / Please write at least 20 characters.');
            return false;
          }
        }
        if (step === STEPS.PRIORITY && !formData.priority) {
          setError('দয়া করে কাজ শুরুর গুরুত্ব সিলেক্ট করুন / Please choose how urgent this is.');
          return false;
        }
        setError(null);
        return true;
      };

      const goNext = () => {
        if (validateCurrentStep()) {
          if (step === STEPS.CATEGORY) setStep(STEPS.LOCATION);
          else if (step === STEPS.LOCATION) setStep(STEPS.SCOPE);
          else if (step === STEPS.SCOPE) setStep(STEPS.PRIORITY);
        }
      };

      const goBack = () => {
        setError(null);
        if (step === STEPS.LOCATION) setStep(STEPS.CATEGORY);
        else if (step === STEPS.SCOPE) setStep(STEPS.LOCATION);
        else if (step === STEPS.PRIORITY) setStep(STEPS.SCOPE);
      };

      const handleSubmit = async () => {
        if (!validateCurrentStep()) return;
        setIsSubmitting(true);
        setError(null);

        const token = (localStorage.getItem('bb_token') || localStorage.getItem('buildbd_token') || '').trim();
        if (!token) {
          setError('You must be signed in to post a job. Please log in from the main portal first.');
          setIsSubmitting(false);
          return;
        }

        try {
          const response = await fetch('/api/projects/wizard-submit', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify(formData)
          });

          if (!response.ok) {
            const text = await response.text();
            let message = 'Request failed';
            try { message = JSON.parse(text).message || message; } catch (_) { /* non-JSON body */ }
            throw new Error(message);
          }
          const data = await response.json();

          setMatchCount(data.matchCount || 0);
          setStep(STEPS.SUCCESS);
        } catch (err) {
          setError(err.message || 'Something went wrong while saving your post.');
        } finally {
          setIsSubmitting(false);
        }
      };

      const progressPct =
        step === STEPS.CATEGORY ? 25 :
        step === STEPS.LOCATION ? 50 :
        step === STEPS.SCOPE ? 75 : 95;

      const stepNumber =
        step === STEPS.CATEGORY ? 1 :
        step === STEPS.LOCATION ? 2 :
        step === STEPS.SCOPE ? 3 :
        step === STEPS.PRIORITY ? 4 : 4;

      const renderGrid = (items, field) => (
        <div style={styles.grid} role="radiogroup" aria-label={`Step ${stepNumber} choices`}>
          {items.map((item) => {
            const isSelected = formData[field] === item.id;
            return (
              <button
                key={item.id}
                type="button"
                className="tile"
                role="radio"
                aria-checked={isSelected}
                onClick={() => {
                  setFormData(prev => ({ ...prev, [field]: item.id }));
                  setError(null);
                }}
                style={{
                  ...styles.tile,
                  backgroundColor: isSelected ? V('--accent') : V('--surface2'),
                  color: isSelected ? '#ffffff' : V('--text'),
                  border: isSelected ? `2px solid ${V('--accent2')}` : `1px solid ${V('--border')}`
                }}
              >
                <div lang="bn" style={styles.tileBn}>{item.labelBn}</div>
                <div lang="en" style={{ ...styles.tileEn, color: isSelected ? '#bfdbfe' : V('--muted') }}>{item.labelEn}</div>
              </button>
            );
          })}
        </div>
      );

      return (
        <div style={styles.container}>
          {step !== STEPS.SUCCESS && (
            <div>
              <h2 lang="bn" style={styles.titleBn}>নতুন কাজের বিজ্ঞাপন দিন</h2>
              <h3 lang="en" style={styles.titleEn}>Post a construction job</h3>
              <div
                style={styles.progressTrack}
                role="progressbar"
                aria-label="Wizard progress"
                aria-valuenow={progressPct}
                aria-valuemin={0}
                aria-valuemax={100}
              >
                <div style={{ ...styles.progressBar, width: `${progressPct}%` }} />
              </div>
            </div>
          )}

          {error && (
            <div style={styles.errorHud} role="alert" aria-live="assertive">
              <div style={styles.errorText}>{error}</div>
            </div>
          )}

          {step === STEPS.CATEGORY && (
            <div>
              <h4 lang="bn" style={styles.promptBn}>১. কাজের বিষয় নির্বাচন করুন:</h4>
              <h5 lang="en" style={styles.promptEn}>1. Select the type of work:</h5>
              {renderGrid(WIZARD_CATEGORIES, 'category')}
              <div style={styles.actionBar}>
                <button
                  onClick={goNext}
                  disabled={!formData.category}
                  className="btn"
                  style={{ ...styles.btnPrimary, opacity: formData.category ? 1 : 0.5 }}
                >
                  পরবর্তী ধাপ / Next step ➜
                </button>
              </div>
            </div>
          )}

          {step === STEPS.LOCATION && (
            <div>
              <h4 lang="bn" style={styles.promptBn}>২. আপনার এলাকা নির্বাচন করুন:</h4>
              <h5 lang="en" style={styles.promptEn}>2. Select your district:</h5>
              {renderGrid(WIZARD_LOCATIONS, 'location')}
              <div style={{ marginTop: '16px', marginBottom: '8px', padding: '12px 14px', borderRadius: '8px', border: `1px dashed ${V('--border')}`, backgroundColor: V('--surface2'), display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '8px' }}>
                <div>
                  <div style={{ fontSize: '13px', fontWeight: 600, color: V('--text') }}>প্রকল্পের সঠিক GPS লোকেশন (ঐচ্ছিক কিন্তু সুপারিশকৃত)</div>
                  <div style={{ fontSize: '11px', color: V('--muted') }}>Exact project GPS coordinates (enables cryptographic milestone verification)</div>
                </div>
                {formData.siteCoordinates ? (
                  <div style={{ display: 'inline-flex', alignItems: 'center', gap: '6px', fontSize: '12px', fontWeight: 700, color: V('--success'), backgroundColor: 'rgba(34,197,94,0.1)', padding: '6px 12px', borderRadius: '6px' }}>
                    <span>📍 {formData.siteCoordinates.latitude}, {formData.siteCoordinates.longitude}</span>
                  </div>
                ) : (
                  <button
                    type="button"
                    onClick={handleGetLocation}
                    disabled={gpsStatus === 'locating'}
                    style={{ minHeight: '36px', padding: '6px 14px', borderRadius: '6px', border: `1px solid ${V('--accent')}`, backgroundColor: 'transparent', color: V('--accent'), fontWeight: 600, fontSize: '12px', cursor: 'pointer' }}
                  >
                    {gpsStatus === 'locating' ? 'লোকেশন শনাক্ত হচ্ছে…' : '📍 লোকেশন দিন / Use GPS'}
                  </button>
                )}
              </div>
              <div style={styles.actionBar}>
                <button onClick={goBack} className="btn" style={styles.btnSecondary}>⬅ পূর্ববর্তী / Back</button>
                <button
                  onClick={goNext}
                  disabled={!formData.location}
                  className="btn"
                  style={{ ...styles.btnPrimary, opacity: formData.location ? 1 : 0.5 }}
                >
                  পরবর্তী ধাপ / Next step ➜
                </button>
              </div>
            </div>
          )}

          {step === STEPS.SCOPE && (
            <div>
              <h4 lang="bn" style={styles.promptBn}>৩. কাজের বিবরণ লিখুন (কমপক্ষে ২০ অক্ষর):</h4>
              <h5 lang="en" style={styles.promptEn}>3. Describe the work (at least 20 characters):</h5>
              <label htmlFor="wizard-scope" style={{ display: 'none' }}>Scope description</label>
              <textarea
                id="wizard-scope"
                value={formData.scopeDescription}
                onChange={(e) => {
                  setFormData(prev => ({ ...prev, scopeDescription: e.target.value }));
                  setError(null);
                }}
                placeholder="উদাহরণ / Example: ২য় তলার ছাদ ঢালাইয়ের জন্য ৪ ইঞ্চি রড বাইন্ডিং এবং সেন্টারিং কাজের মিস্ত্রি প্রয়োজন…"
                style={styles.textarea}
                rows={5}
              />
              <div style={styles.charCounter}>
                দৈর্ঘ্য / Characters: {formData.scopeDescription.trim().length} (কমপক্ষে ২০ প্রয়োজন / 20 min)
              </div>
              <div style={styles.actionBar}>
                <button onClick={goBack} className="btn" style={styles.btnSecondary}>⬅ পূর্ববর্তী / Back</button>
                <button
                  onClick={goNext}
                  disabled={formData.scopeDescription.trim().length < 20}
                  className="btn"
                  style={{
                    ...styles.btnPrimary,
                    opacity: formData.scopeDescription.trim().length >= 20 ? 1 : 0.5
                  }}
                >
                  পরবর্তী ধাপ / Next step ➜
                </button>
              </div>
            </div>
          )}

          {step === STEPS.PRIORITY && (
            <div>
              <h4 lang="bn" style={styles.promptBn}>৪. কাজ শুরুর সময় / বাজেট কেমন?</h4>
              <h5 lang="en" style={styles.promptEn}>4. How urgent is the work, and what's your budget tier?</h5>
              {renderGrid(WIZARD_PRIORITIES, 'priority')}
              <div style={styles.actionBar}>
                <button onClick={goBack} className="btn" style={styles.btnSecondary} disabled={isSubmitting}>⬅ পূর্ববর্তী / Back</button>
                <button
                  onClick={handleSubmit}
                  disabled={!formData.priority || isSubmitting}
                  className="btn"
                  style={{
                    ...styles.btnSubmit,
                    opacity: (formData.priority && !isSubmitting) ? 1 : 0.5
                  }}
                >
                  {isSubmitting ? 'প্রক্রিয়াকরণ হচ্ছে / Posting…' : 'বিজ্ঞাপন প্রকাশ করুন / Publish job 🚀'}
                </button>
              </div>
            </div>
          )}

          {step === STEPS.SUCCESS && (
            <div style={styles.successCard} role="status" aria-live="polite">
              <div style={styles.successIcon} aria-hidden="true">✓</div>
              <h2 lang="bn" style={styles.successTitleBn}>বিজ্ঞাপন সফলভাবে প্রকাশিত হয়েছে!</h2>
              <h3 lang="en" style={styles.successTitleEn}>Your job post is live.</h3>

              <div style={styles.matchHud}>
                <div style={styles.matchNumber}>{matchCount}</div>
                <div lang="bn" style={styles.matchLabelBn}>আপনার এলাকায় অভিজ্ঞ ঠিকাদার পাওয়া গেছে যারা এই ক্যাটাগরিতে কাজ করতে ইচ্ছুক।</div>
                <div lang="en" style={styles.matchLabelEn}>Verified contractors in your district match this category and scope.</div>
              </div>

              <div lang="bn" style={styles.successNoteBn}>
                ঠিকাদাররা আপনার বিবরণ দেখে খুব শীঘ্রই দর (কোট) পাঠাবেন। আপনার মোবাইলে এসএমএস পাঠানো হবে।
              </div>
              <div lang="en" style={styles.successNoteEn}>
                Contractors will review your post and send quotes shortly. You'll be notified by SMS.
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('wizard-mount'));
    root.render(<App />);
  </script>
</body>
</html>
