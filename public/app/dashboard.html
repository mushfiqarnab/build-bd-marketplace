<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#002045" />
<meta name="color-scheme" content="light" />
<meta name="referrer" content="no-referrer" />
<link rel="preload" href="/app/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
<!-- Default UI language is bn; preload the Bangla face so the first paint is not fallback. -->
<link rel="preload" href="/app/fonts/noto-sans-bengali-bengali-400-normal.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/app/fonts/material-symbols-subset.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/app/app.css?v=960d4a1b54" />

<title>Dashboard — Build-BD</title>
<meta name="robots" content="noindex" />
<script type="module" src="/app/js/pages/dashboard.js?v=960d4a1b54"></script>
</head>
<body class="min-h-screen flex flex-col">
<a href="#main" class="sr-only-focusable fixed top-2 left-2 z-50 btn-primary" data-i18n="nav.skip">Skip to main content</a>
<header class="bg-surface-card border-b border-border-subtle">
  <div class="mx-auto max-w-container-max px-md md:px-gutter h-16 flex items-center justify-between gap-md">
    <a href="/app/" class="flex items-center gap-sm min-h-[44px] text-primary-container font-bold text-h3 tracking-tight" aria-label="Build-BD home">
      <span class="icon icon-fill text-cta-amber" aria-hidden="true">construction</span>
      <span>Build-BD</span>
    </a>
    <nav class="flex items-center gap-sm" aria-label="Account">
      <button type="button" class="btn-ghost px-md" data-lang-toggle>English</button>
      <a href="/app/login.html" class="btn-outline" data-when="signed-out" data-i18n="nav.login">Log in</a>
      <a href="/app/dashboard.html" class="btn-ghost hidden sm:inline-flex" data-when="signed-in" hidden>
        <span class="icon" aria-hidden="true">person</span>
        <span data-me-phone></span>
      </a>
      <a href="/app/" class="btn-outline" data-when="signed-in" data-logout hidden>
        <span class="icon" aria-hidden="true">logout</span>
        <span data-i18n="nav.logout">Log out</span>
      </a>
    </nav>
  </div>
</header>

<main id="main" class="flex-1 mx-auto w-full max-w-container-max px-md md:px-gutter py-xl">
  <div id="loading" class="space-y-md" aria-busy="true">
    <div class="skeleton h-10 w-64"></div>
    <div class="skeleton h-24 w-full"></div>
  </div>
  <section id="content" hidden>
    <h1 class="text-h2" data-i18n="dash.title">Dashboard</h1>
    <p class="mt-sm text-body-lg text-on-surface-variant">
      <span data-i18n="dash.signedInAs">Signed in as</span>
      <strong id="who" class="text-on-surface"></strong>
    </p>
    <!-- CLIENT-only CTA: shown by dashboard.js once role is known. -->
    <a id="cta-post-project" href="/app/post-project.html" class="btn-primary mt-lg w-full sm:w-auto" hidden>
      <span class="icon" aria-hidden="true">add</span>
      <span data-i18n="dash.postProject">Post a new project</span>
    </a>
    <!-- CONTRACTOR-only CTA: shown by dashboard.js for F5. -->
    <a id="cta-find-projects" href="/app/tenders.html" class="btn-primary mt-lg w-full sm:w-auto" hidden>
      <span class="icon" aria-hidden="true">handyman</span>
      <span data-i18n="dash.findProjects">Find projects</span>
    </a>


    <div class="card p-lg mt-lg flex gap-sm items-start">
      <span class="icon text-primary-container" aria-hidden="true">info</span>
      <p class="text-body-md" data-i18n="dash.comingSoon">Your projects and bids will appear here.</p>
    </div>
  </section>
  <p id="error" class="alert-error" role="alert" hidden></p>
</main>
<footer class="mt-xxl border-t border-border-subtle bg-surface-card">
  <div class="mx-auto max-w-container-max px-md md:px-gutter py-lg flex flex-col sm:flex-row gap-sm justify-between text-body-sm text-on-surface-variant">
    <span data-i18n="footer.rights">© Build-BD</span>
    <span class="inline-flex items-center gap-xs">
      <span class="icon text-[18px]" aria-hidden="true">lock</span>
      <span data-i18n="footer.beta">Invite-only beta</span>
    </span>
  </div>
</footer>

</body>
</html>
