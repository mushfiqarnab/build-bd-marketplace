<!doctype html>
<html lang="bn">
<head>
<!--#include head -->
<title>Post a project — Build-BD</title>
<meta name="robots" content="noindex" />
<script type="module" src="/app/js/pages/post-project.js?v={{v}}"></script>
</head>
<body class="min-h-[100dvh] flex flex-col bg-surface-main">
<!--#include header -->
<main id="main" class="flex-1 mx-auto w-full max-w-container-max px-md md:px-gutter py-xl">

  <!-- Boot-time guard: a brief skeleton while /auth/me resolves + categories load. -->
  <div id="loading" class="space-y-md" aria-busy="true" aria-live="polite">
    <div class="skeleton h-10 w-64"></div>
    <div class="skeleton h-24 w-full"></div>
  </div>

  <section id="content" hidden class="mx-auto w-full max-w-2xl">
    <div class="flex items-center gap-sm">
      <span class="icon text-[28px] text-primary-container bg-primary-fixed rounded-xl p-sm" aria-hidden="true">add</span>
      <div>
        <h1 class="text-h2" data-i18n="post.title">Post a new project</h1>
        <p class="text-body-md text-on-surface-variant mt-xs" data-i18n="post.subtitle">Describe what to build. Verified contractors will bid.</p>
      </div>
    </div>

    <div id="alert" class="mt-lg" role="alert" aria-live="assertive" hidden></div>

    <form id="form" class="card mt-lg p-lg sm:p-xl space-y-lg" novalidate>

      <!-- Title -->
      <div>
        <label for="title" class="field-label" data-i18n="post.field.title">Project title</label>
        <input id="title" name="title" type="text" required maxlength="100" autocomplete="off"
               class="field" placeholder="3-storey residential building, Mirpur"
               data-i18n-placeholder="post.field.titlePlaceholder" aria-describedby="title-error" />
        <p id="title-error" class="field-error" hidden></p>
      </div>

      <!-- Category -->
      <div>
        <label for="category" class="field-label" data-i18n="post.field.category">Category</label>
        <select id="category" name="category" required class="field" aria-describedby="category-error">
          <option value="" data-i18n="post.field.categoryPlaceholder">Choose a category…</option>
          <!-- populated at runtime from /api/environment -->
        </select>
        <p id="category-error" class="field-error" hidden></p>
      </div>

      <!-- Location -->
      <div>
        <label for="location" class="field-label" data-i18n="post.field.location">District / Area</label>
        <input id="location" name="location" type="text" required maxlength="100" autocomplete="address-level2"
               class="field" placeholder="Dhaka, Mirpur-10"
               data-i18n-placeholder="post.field.locationPlaceholder" aria-describedby="location-error" />
        <p id="location-error" class="field-error" hidden></p>
      </div>

      <!-- Site coordinates (both-or-neither) -->
      <div>
        <label class="field-label" data-i18n="post.field.coords">Site coordinates (optional, but recommended)</label>
        <p class="text-body-sm text-on-surface-variant mb-xs" data-i18n="post.field.coordsHelp">GPS stamping needs these; evidence submissions are matched against the site.</p>
        <div class="grid grid-cols-2 gap-sm">
          <div>
            <input id="lat" name="lat" type="text" inputmode="decimal" autocomplete="off"
                   class="field" placeholder="23.8103" aria-label="Latitude" />
          </div>
          <div>
            <input id="lng" name="lng" type="text" inputmode="decimal" autocomplete="off"
                   class="field" placeholder="90.4125" aria-label="Longitude" />
          </div>
        </div>
        <p id="coords-error" class="field-error" hidden></p>
        <button id="geo-btn" type="button" class="btn-outline mt-sm w-full sm:w-auto">
          <span class="icon" aria-hidden="true">place</span>
          <span data-i18n="post.field.useMyLocation">Use my current location</span>
        </button>
      </div>

      <!-- Budget -->
      <div>
        <label for="budget" class="field-label" data-i18n="post.field.budget">Budget (BDT, whole taka)</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-md flex items-center text-on-surface-variant" aria-hidden="true">৳</span>
          <input id="budget" name="budget" type="text" inputmode="numeric" required autocomplete="off"
                 class="field pl-[2rem]" placeholder="500000" data-i18n-placeholder="post.field.budgetPlaceholder"
                 aria-describedby="budget-help budget-error" />
        </div>
        <p id="budget-help" class="text-body-sm text-on-surface-variant mt-xs" data-i18n="post.field.budgetHelp">Enter the whole-taka amount. No decimals or paisa.</p>
        <p id="budget-formatted" class="text-body-sm text-on-surface mt-xs" hidden></p>
        <p id="budget-error" class="field-error" hidden></p>
      </div>

      <!-- Description -->
      <div>
        <label for="description" class="field-label" data-i18n="post.field.description">Scope description</label>
        <textarea id="description" name="description" required minlength="20" maxlength="4000" rows="6"
                  class="field" placeholder="e.g. Ground-floor renovation: tiling, electrical, plumbing. 1500 sqft."
                  data-i18n-placeholder="post.field.descriptionPlaceholder"
                  aria-describedby="description-count description-error"></textarea>
        <div class="flex items-center justify-between mt-xs">
          <p id="description-help" class="text-body-sm text-on-surface-variant" data-i18n="post.field.descriptionHelp">Minimum 20 characters.</p>
          <p id="description-count" class="text-body-sm text-on-surface-variant" aria-live="polite"></p>
        </div>
        <p id="description-error" class="field-error" hidden></p>
      </div>

      <div class="flex flex-wrap gap-sm">
        <button id="submit-btn" type="submit" class="btn-primary flex-1 min-w-[160px]">
          <span data-i18n="post.submit">Post project</span>
          <span class="icon" aria-hidden="true">arrow_forward</span>
        </button>
        <a href="/app/dashboard.html" class="btn-outline flex-1 min-w-[160px] text-center">
          <span class="icon" aria-hidden="true">arrow_back</span>
          <span data-i18n="post.cancel">Cancel</span>
        </a>
      </div>
    </form>
  </section>

  <p id="error" class="alert-error mt-lg" role="alert" hidden></p>
</main>
<!--#include footer -->
</body>
</html>
