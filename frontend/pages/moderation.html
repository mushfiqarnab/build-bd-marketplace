<!doctype html>
<html lang="bn">
<head>
<!--#include head -->
<title>Dispute moderation — E-WorksBD</title>
<meta name="robots" content="noindex" />
<script type="module" src="/app/js/pages/moderation.js?v={{v}}"></script>
</head>
<body class="min-h-[100dvh] flex flex-col bg-surface-main">
<!--#include header -->
<main id="main" class="flex-1 mx-auto w-full max-w-container-max px-md md:px-gutter py-xl">

  <div id="loading" class="space-y-lg" aria-busy="true" aria-live="polite">
    <div class="skeleton h-9 w-56"></div>
    <div class="skeleton h-16 w-full rounded-2xl"></div>
    <div class="skeleton h-40 w-full rounded-2xl"></div>
  </div>

  <section id="content" hidden>
    <div class="flex items-center gap-sm mb-md">
      <span class="icon text-[28px] text-primary-container bg-primary-fixed rounded-xl p-sm" aria-hidden="true">shield</span>
      <div>
        <h1 class="text-h2" data-i18n="moderation.title">Dispute Queue</h1>
        <p id="summary" class="text-body-sm text-on-surface-variant mt-xs" aria-live="polite" aria-atomic="true"></p>
      </div>
    </div>

    <div id="alert" class="mb-lg" role="alert" aria-live="assertive" hidden></div>

    <!-- Dispute Category Tabs -->
    <div class="flex border-b border-border-subtle mb-lg gap-sm overflow-x-auto" role="tablist" aria-label="Dispute Categories">
      <button id="cat-milestones" role="tab" aria-selected="true" class="px-md py-sm font-semibold border-b-2 border-primary text-primary flex items-center gap-xs min-h-[44px] whitespace-nowrap">
        <span class="icon" aria-hidden="true">shield</span>
        <span data-i18n="moderation.cat.milestones">Milestone Disputes</span>
        <span id="badge-milestones-count" class="badge-category ml-xs">0</span>
      </button>
      <button id="cat-materials" role="tab" aria-selected="false" class="px-md py-sm font-semibold border-b-2 border-transparent text-on-surface-variant hover:text-on-surface flex items-center gap-xs min-h-[44px] whitespace-nowrap">
        <span class="icon" aria-hidden="true">inventory_2</span>
        <span data-i18n="moderation.cat.materials">Disputed Material Orders</span>
        <span id="badge-materials-count" class="badge-category ml-xs">0</span>
      </button>
      <button id="cat-security-gd" role="tab" aria-selected="false" class="px-md py-sm font-semibold border-b-2 border-transparent text-on-surface-variant hover:text-on-surface flex items-center gap-xs min-h-[44px] whitespace-nowrap">
        <span class="icon" aria-hidden="true">warning</span>
        <span data-i18n="moderation.cat.securityGd">48h Police GD Disputes</span>
        <span id="badge-security-gd-count" class="badge-category ml-xs">0</span>
      </button>
    </div>

    <nav id="filter-bar" aria-label="Filter disputes" class="flex flex-wrap gap-sm mb-xl" role="tablist">
      <button type="button" class="chip-active min-h-[44px]" data-filter="open" role="tab" aria-selected="true" aria-pressed="true" data-i18n="moderation.filter.open">Open Disputes</button>
      <button type="button" class="chip min-h-[44px]" data-filter="resolved" role="tab" aria-selected="false" aria-pressed="false" data-i18n="moderation.filter.resolved">Resolved</button>
      <button type="button" class="chip min-h-[44px]" data-filter="all" role="tab" aria-selected="false" aria-pressed="false" data-i18n="moderation.filter.all">All</button>
    </nav>

    <ul id="dispute-list" class="space-y-md list-none p-0 m-0" role="list"></ul>

    <div id="empty" class="card p-xl flex flex-col items-center gap-md text-center" hidden>
      <span class="icon text-[48px] text-on-surface-variant" aria-hidden="true">check_circle</span>
      <p class="text-body-lg text-on-surface-variant" data-i18n="moderation.empty">No disputes match this filter.</p>
    </div>
  </section>

  <!-- Evidence Dossier Modal Dialog -->
  <dialog id="dossier-modal" class="backdrop:bg-black/50 p-0 rounded-2xl border border-border-subtle bg-surface-main max-w-2xl w-full m-auto shadow-2xl" hidden>
    <div class="p-lg space-y-md max-h-[85vh] overflow-y-auto">
      <div class="flex items-start justify-between gap-md border-b border-border-subtle pb-sm">
        <div>
          <h2 id="dossier-title" class="text-h3 font-bold text-on-surface" data-i18n="moderation.dossier.title">Dispute Evidence Dossier</h2>
          <p id="dossier-project" class="text-body-md text-primary font-medium mt-xs"></p>
        </div>
        <button id="dossier-close-btn" type="button" class="btn-ghost p-xs min-h-[44px] min-w-[44px]" aria-label="Close">
          <span class="icon text-[24px]" aria-hidden="true">close</span>
        </button>
      </div>

      <div id="dossier-alert" class="alert-error" role="alert" hidden></div>

      <!-- Parties and Milestone Facts -->
      <dl id="dossier-facts" class="grid grid-cols-1 sm:grid-cols-2 gap-sm p-md bg-surface-container-low rounded-xl border border-border-subtle"></dl>

      <!-- Dispute Reason Box -->
      <div class="space-y-xs">
        <p class="text-label-sm font-semibold text-on-surface" data-i18n="moderation.dossier.rejectionReason">Client Dispute Reason</p>
        <p id="dossier-reason" class="text-body-md text-on-surface p-md rounded-xl bg-surface border border-outline-variant whitespace-pre-line"></p>
      </div>

      <!-- Evidence Log Box -->
      <div class="space-y-xs">
        <p class="text-label-sm font-semibold text-on-surface" data-i18n="moderation.dossier.evidence">Evidence Log</p>
        <div id="dossier-evidence-list" class="space-y-xs"></div>
      </div>

      <!-- Resolution Section (for Open disputes) -->
      <div id="dossier-resolve-box" class="border-t border-border-subtle pt-md space-y-md" hidden>
        <h3 class="text-title-md font-semibold text-on-surface" data-i18n="moderation.dossier.resolveTitle">Issue Binding Decision</h3>

        <form id="resolve-form" class="space-y-md" novalidate>
          <div>
            <label class="field-label" data-i18n="moderation.dossier.verdictLabel">Verdict</label>
            <div class="flex flex-col gap-sm mt-xs">
              <label class="flex items-center gap-xs cursor-pointer min-h-[44px] p-sm rounded-lg border border-border-subtle">
                <input type="radio" name="verdict" value="FORCE_APPROVE" checked />
                <span class="text-body-md font-medium text-on-surface" data-i18n="moderation.verdict.forceApprove">Force Approve & Release Payment</span>
              </label>
              <label class="flex items-center gap-xs cursor-pointer min-h-[44px] p-sm rounded-lg border border-border-subtle">
                <input type="radio" name="verdict" value="CANCEL_AND_RESTART" />
                <span class="text-body-md font-medium text-on-surface" data-i18n="moderation.verdict.cancelRestart">Cancel Milestone & Reset to In-Progress</span>
              </label>
            </div>
          </div>

          <div>
            <div class="flex items-center justify-between">
              <label for="justification-input" class="field-label" data-i18n="moderation.dossier.justification">Justification Note (minimum 20 characters)</label>
              <span id="justification-count" class="text-label-sm text-on-surface-variant font-mono">0 / 20</span>
            </div>
            <textarea id="justification-input" name="justification" class="field mt-xs" rows="3" minlength="20" maxlength="1000" required></textarea>
            <p id="justification-error" class="alert-error mt-xs" role="alert" hidden></p>
          </div>

          <div class="flex flex-wrap gap-sm justify-end pt-sm">
            <button id="resolve-submit-btn" type="submit" class="btn-primary min-h-[44px]">
              <span class="icon" aria-hidden="true">done_all</span>
              <span data-i18n="moderation.action.submitVerdict">Record Verdict</span>
            </button>
          </div>
        </form>
      </div>

      <!-- Resolved Details (when already resolved) -->
      <div id="dossier-resolved-view" class="border-t border-border-subtle pt-md space-y-xs" hidden>
        <p class="text-label-sm font-semibold text-on-surface" data-i18n="moderation.card.verdict">Verdict</p>
        <p id="resolved-verdict" class="text-body-md font-bold text-primary"></p>
        <p id="resolved-justification" class="text-body-sm text-on-surface whitespace-pre-line mt-xs"></p>
        <p id="resolved-date" class="text-body-sm text-on-surface-variant mt-xs"></p>
      </div>
    </div>
  </dialog>

  <p id="boot-error" class="alert-error mt-lg" role="alert" hidden></p>
</main>
<!--#include footer -->
</body>
</html>
