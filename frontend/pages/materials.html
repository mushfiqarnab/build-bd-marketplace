<!doctype html>
<html lang="bn">
<head>
<!--#include head -->
<title data-i18n="materials.pageTitle">Materials Marketplace — Build-BD</title>
<meta name="description" content="Direct from certified mills and suppliers — verified rebar, cement, aggregates with transparent bulk tier pricing." />
<script type="module" src="/app/js/pages/materials.js?v={{v}}"></script>
</head>
<body class="min-h-[100dvh] flex flex-col bg-surface-main" style="min-height:100vh;min-height:100dvh">
<!--#include header -->
<main id="main" class="flex-1 mx-auto w-full max-w-container-max px-md md:px-gutter py-xl">

  <!-- Hero Header -->
  <header class="mb-lg">
    <div class="flex items-center gap-sm mb-xs">
      <span class="icon text-[28px] text-primary-container bg-primary-fixed rounded-xl p-sm" aria-hidden="true">construction</span>
      <div>
        <h1 class="text-h2" data-i18n="materials.title">Materials Marketplace</h1>
        <p class="text-body-sm text-on-surface-variant mt-xs" data-i18n="materials.subtitle">Direct-from-mill verified materials with bulk volume pricing and BSTI assurance.</p>
      </div>
    </div>
  </header>

  <!-- Filter & Search Controls Bar -->
  <section class="card p-md mb-lg flex flex-col gap-md" aria-label="Filter materials">
    <!-- Category Rail -->
    <div id="category-rail" class="flex gap-xs overflow-x-auto pb-xs no-scrollbar" role="tablist" aria-label="Material Categories">
      <button id="cat-all" role="tab" aria-selected="true" data-cat="" class="btn-primary min-h-[44px] px-md py-xs text-body-sm whitespace-nowrap">
        <span data-i18n="materials.cat.all">All Materials</span>
      </button>
      <button id="cat-rod" role="tab" aria-selected="false" data-cat="ROD" class="btn-outline min-h-[44px] px-md py-xs text-body-sm whitespace-nowrap">
        <span data-i18n="materials.cat.rod">Rod / Rebar</span>
      </button>
      <button id="cat-cement" role="tab" aria-selected="false" data-cat="CEMENT" class="btn-outline min-h-[44px] px-md py-xs text-body-sm whitespace-nowrap">
        <span data-i18n="materials.cat.cement">Cement</span>
      </button>
      <button id="cat-sand" role="tab" aria-selected="false" data-cat="SAND" class="btn-outline min-h-[44px] px-md py-xs text-body-sm whitespace-nowrap">
        <span data-i18n="materials.cat.sand">Sand</span>
      </button>
      <button id="cat-brick" role="tab" aria-selected="false" data-cat="BRICK" class="btn-outline min-h-[44px] px-md py-xs text-body-sm whitespace-nowrap">
        <span data-i18n="materials.cat.brick">Brick</span>
      </button>
      <button id="cat-stone" role="tab" aria-selected="false" data-cat="STONE" class="btn-outline min-h-[44px] px-md py-xs text-body-sm whitespace-nowrap">
        <span data-i18n="materials.cat.stone">Stone / Aggregate</span>
      </button>
      <button id="cat-tiles" role="tab" aria-selected="false" data-cat="TILES" class="btn-outline min-h-[44px] px-md py-xs text-body-sm whitespace-nowrap">
        <span data-i18n="materials.cat.tiles">Tiles</span>
      </button>
    </div>

    <!-- Secondary Filter Controls -->
    <div class="flex flex-wrap items-center gap-sm">
      <div class="flex-1 min-w-[200px]">
        <label for="filter-district" class="sr-only" data-i18n="materials.filter.district">Select District</label>
        <select id="filter-district" class="field py-xs text-body-sm min-h-[44px] w-full">
          <option value="" data-i18n="materials.filter.allDistricts">All Delivery Districts</option>
          <option value="Dhaka">Dhaka</option>
          <option value="Gazipur">Gazipur</option>
          <option value="Narayanganj">Narayanganj</option>
          <option value="Chattogram">Chattogram</option>
          <option value="Sylhet">Sylhet</option>
          <option value="Rajshahi">Rajshahi</option>
          <option value="Khulna">Khulna</option>
          <option value="Barishal">Barishal</option>
          <option value="Rangpur">Rangpur</option>
          <option value="Mymensingh">Mymensingh</option>
        </select>
      </div>

      <div class="min-w-[160px]">
        <label for="filter-sort" class="sr-only" data-i18n="materials.filter.sort">Sort By</label>
        <select id="filter-sort" class="field py-xs text-body-sm min-h-[44px] w-full">
          <option value="price_asc" data-i18n="materials.sort.priceAsc">Lowest Price First</option>
          <option value="price_desc" data-i18n="materials.sort.priceDesc">Highest Price First</option>
          <option value="newest" data-i18n="materials.sort.newest">Newest Listed</option>
        </select>
      </div>

      <button id="btn-reset-filters" type="button" class="btn-outline min-h-[44px] px-md flex items-center gap-xs text-on-surface-variant">
        <span class="icon text-[18px]" aria-hidden="true">refresh</span>
        <span data-i18n="materials.filter.reset">Reset</span>
      </button>
    </div>
  </section>

  <!-- Loading State -->
  <div id="catalog-loading" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-md" aria-busy="true" aria-live="polite">
    <div class="card p-md space-y-sm">
      <div class="skeleton h-6 w-24"></div>
      <div class="skeleton h-8 w-full"></div>
      <div class="skeleton h-12 w-full"></div>
    </div>
    <div class="card p-md space-y-sm">
      <div class="skeleton h-6 w-24"></div>
      <div class="skeleton h-8 w-full"></div>
      <div class="skeleton h-12 w-full"></div>
    </div>
    <div class="card p-md space-y-sm">
      <div class="skeleton h-6 w-24"></div>
      <div class="skeleton h-8 w-full"></div>
      <div class="skeleton h-12 w-full"></div>
    </div>
  </div>

  <!-- Active Product Grid -->
  <section id="catalog-content" hidden>
    <div class="flex items-center justify-between mb-md">
      <p id="catalog-count" class="text-body-sm text-on-surface-variant" aria-live="polite" aria-atomic="true"></p>
    </div>

    <ul id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-md list-none p-0 m-0" role="list"></ul>

    <!-- Empty State -->
    <div id="catalog-empty" class="card p-xl flex flex-col items-center gap-md text-center mt-md" hidden>
      <span class="icon text-[48px] text-on-surface-variant" aria-hidden="true">construction</span>
      <p class="text-body-lg text-on-surface-variant" data-i18n="materials.empty">No materials currently matching the selected criteria.</p>
    </div>

    <!-- Pagination / Load More -->
    <div id="catalog-pagination" class="flex justify-center mt-xl" hidden>
      <button id="btn-load-more" type="button" class="btn-outline min-h-[44px] px-xl">
        <span data-i18n="materials.loadMore">Load More Materials</span>
      </button>
    </div>
  </section>

  <!-- Bulk Tier Pricing & Estimation Modal -->
  <dialog id="tier-modal" class="modal card p-lg max-w-lg w-full backdrop:bg-black/50" role="dialog" aria-modal="true" aria-labelledby="modal-product-title">
    <div class="flex items-start justify-between border-b border-border-subtle pb-sm mb-md">
      <div>
        <h2 id="modal-product-title" class="text-h3 font-bold text-on-surface"></h2>
        <p id="modal-product-brand" class="text-body-sm text-primary font-semibold"></p>
      </div>
      <button id="tier-modal-close" type="button" class="btn-outline p-xs min-h-[44px] min-w-[44px] flex items-center justify-center text-on-surface-variant" aria-label="Close">
        <span class="icon" aria-hidden="true">close</span>
      </button>
    </div>

    <div class="space-y-md">
      <!-- Specifications Summary -->
      <div id="modal-specs-wrap" class="bg-surface-variant/30 p-sm rounded-lg text-body-sm">
        <dl id="modal-specs-list" class="grid grid-cols-2 gap-xs m-0"></dl>
      </div>

      <!-- Bulk Tiers Breakdown Table -->
      <div>
        <h3 class="text-label-sm font-semibold text-on-surface mb-xs" data-i18n="materials.tier.tableTitle">Volume Discount Tiers</h3>
        <ul id="modal-tiers-list" class="space-y-xs list-none p-0 m-0"></ul>
      </div>

      <!-- Interactive Calculator -->
      <div class="card p-md bg-surface-container border border-border-subtle">
        <label for="modal-calc-quantity" class="text-label-sm font-semibold text-on-surface block mb-xs" data-i18n="materials.calc.label">Estimate Order Quantity</label>
        <div class="flex items-center gap-sm">
          <input id="modal-calc-quantity" type="number" min="1" step="1" value="1" class="field py-xs px-sm text-body-md font-semibold min-h-[44px] w-32" />
          <span id="modal-calc-unit" class="text-body-md text-on-surface-variant font-medium"></span>
        </div>
        <div class="mt-sm pt-sm border-t border-border-subtle flex items-center justify-between">
          <span class="text-body-sm text-on-surface-variant" data-i18n="materials.calc.totalEstimate">Estimated Cost:</span>
          <span id="modal-calc-total" class="text-h3 font-bold text-primary"></span>
        </div>
        <p id="modal-calc-savings" class="text-label-sm text-cta-amber mt-xs font-semibold" hidden></p>
      </div>
    </div>
  </dialog>

  <p id="boot-error" class="alert-error mt-lg" role="alert" hidden></p>
</main>
<!--#include footer -->
</body>
</html>
