<!doctype html>
<html lang="bn">
<head>
<!--#include head -->
<title>Log in — Build-BD</title>
<meta name="robots" content="noindex" />
<script type="module" src="/app/js/pages/login.js?v={{v}}"></script>
</head>
<body class="min-h-[100dvh] flex flex-col bg-surface-main">
<!--#include header -->
<main id="main" class="flex-1 flex items-start sm:items-center justify-center px-md py-xl">
  <div class="card w-full max-w-md p-lg sm:p-xl">
    <div class="flex justify-center">
      <span class="icon text-[32px] text-primary-container bg-primary-fixed rounded-xl p-sm" aria-hidden="true">lock</span>
    </div>
    <h1 class="mt-md text-center text-h3" data-i18n="login.title">Log in or sign up</h1>
    <p class="mt-xs text-center text-body-sm text-on-surface-variant" data-i18n="login.subtitle">We will send a 6-digit code to your phone.</p>

    <div id="alert" class="mt-lg" role="alert" aria-live="assertive" hidden></div>

    <!-- Step 1: phone (+ role disclosed only for new sign-ups) -->
    <form id="phone-form" class="mt-lg space-y-lg" novalidate>
      <div>
        <label for="phone" class="field-label" data-i18n="login.phone.label">Mobile number</label>
        <div class="flex">
          <span class="inline-flex items-center px-md rounded-l-lg border border-r-0 border-outline-variant bg-surface-container-low text-on-surface-variant" aria-hidden="true">+880</span>
          <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel-national" maxlength="20" required
                 class="field rounded-l-none" placeholder="1XXXXXXXXX" data-i18n-placeholder="login.phone.placeholder"
                 aria-describedby="phone-error" />
        </div>
        <p id="phone-error" class="field-error" hidden></p>
      </div>

      <details id="new-here" class="rounded-lg border border-outline-variant p-md" open>
        <summary class="min-h-[32px] cursor-pointer select-none text-body-sm font-semibold text-on-surface-variant" data-i18n="login.newHere">New here? Choose how you'll use Build-BD</summary>

        <!-- Track Switcher -->
        <div class="mt-sm flex gap-xs" role="tablist" aria-label="Registration Track">
          <button type="button" id="track-hire-btn" role="tab" aria-selected="false" class="flex-1 min-h-[44px] px-sm py-xs text-body-sm font-semibold rounded-lg border border-outline-variant bg-surface text-on-surface-variant">
            <span data-i18n="login.track.hire">I want to Hire</span>
          </button>
          <button type="button" id="track-work-btn" role="tab" aria-selected="true" class="flex-1 min-h-[44px] px-sm py-xs text-body-sm font-semibold rounded-lg border border-primary-container bg-primary-fixed text-primary-container">
            <span data-i18n="login.track.work">I want to Work / Sell</span>
          </button>
        </div>

        <!-- Interactive Persona Selection Grid -->
        <div id="persona-selector" class="mt-sm space-y-xs">
          <!-- Work Track Personas (default) -->
          <div id="work-personas" class="grid gap-xs">
            <button type="button" class="persona-btn text-left p-sm rounded-lg border border-primary-container bg-primary-fixed/40 hover:bg-primary-fixed transition flex items-start gap-sm min-h-[44px]" data-role="CONTRACTOR" data-dest="/app/works.html?nature=MICRO">
              <span class="icon text-[20px] text-primary" aria-hidden="true">handyman</span>
              <div>
                <p class="text-body-sm font-bold text-on-surface" data-i18n="login.persona.tech">Electrician / Plumber / Technician</p>
                <p class="text-[12px] text-on-surface-variant" data-i18n="login.persona.techDesc">Quick repair tasks, wiring, servicing (৳200+ micro-floor)</p>
              </div>
            </button>
            <button type="button" class="persona-btn text-left p-sm rounded-lg border border-outline-variant hover:border-primary-container transition flex items-start gap-sm min-h-[44px]" data-role="CONTRACTOR" data-dest="/app/domestic-labour.html?onboard=1">
              <span class="icon text-[20px] text-primary" aria-hidden="true">person</span>
              <div>
                <p class="text-body-sm font-bold text-on-surface" data-i18n="login.persona.care">Domestic Worker / Caregiver</p>
                <p class="text-[12px] text-on-surface-variant" data-i18n="login.persona.careDesc">Cook, cleaner, maid, babysitter (DWPWP-2015 compliant)</p>
              </div>
            </button>
            <button type="button" class="persona-btn text-left p-sm rounded-lg border border-outline-variant hover:border-primary-container transition flex items-start gap-sm min-h-[44px]" data-role="CONTRACTOR" data-dest="/app/works.html?nature=WORKS">
              <span class="icon text-[20px] text-primary" aria-hidden="true">construction</span>
              <div>
                <p class="text-body-sm font-bold text-on-surface" data-i18n="login.persona.civil">Civil Contractor / Firm</p>
                <p class="text-[12px] text-on-surface-variant" data-i18n="login.persona.civilDesc">RCC construction, tenders, multi-milestone BOQ</p>
              </div>
            </button>
            <button type="button" class="persona-btn text-left p-sm rounded-lg border border-outline-variant hover:border-primary-container transition flex items-start gap-sm min-h-[44px]" data-role="SUPPLIER" data-dest="/app/material-orders.html">
              <span class="icon text-[20px] text-primary" aria-hidden="true">inventory_2</span>
              <div>
                <p class="text-body-sm font-bold text-on-surface" data-i18n="login.persona.supplier">Building Material Dealer</p>
                <p class="text-[12px] text-on-surface-variant" data-i18n="login.persona.supplierDesc">Rebar, cement, bricks, sanitary supplies</p>
              </div>
            </button>
          </div>

          <!-- Hire Track Personas -->
          <div id="hire-personas" class="grid gap-xs" hidden>
            <button type="button" class="persona-btn text-left p-sm rounded-lg border border-outline-variant hover:border-primary-container transition flex items-start gap-sm min-h-[44px]" data-role="CLIENT" data-dest="/app/post-project.html?mode=quick">
              <span class="icon text-[20px] text-primary" aria-hidden="true">handyman</span>
              <div>
                <p class="text-body-sm font-bold text-on-surface" data-i18n="login.persona.hireRepair">Quick Repair / Home Service</p>
                <p class="text-[12px] text-on-surface-variant" data-i18n="login.persona.hireRepairDesc">Electrician, plumber, AC servicing (zero advance)</p>
              </div>
            </button>
            <button type="button" class="persona-btn text-left p-sm rounded-lg border border-outline-variant hover:border-primary-container transition flex items-start gap-sm min-h-[44px]" data-role="CLIENT" data-dest="/app/domestic-labour.html">
              <span class="icon text-[20px] text-primary" aria-hidden="true">person</span>
              <div>
                <p class="text-body-sm font-bold text-on-surface" data-i18n="login.persona.hireCare">Domestic Staff / Maid</p>
                <p class="text-[12px] text-on-surface-variant" data-i18n="login.persona.hireCareDesc">Verified bua, babysitter, cook with trial</p>
              </div>
            </button>
            <button type="button" class="persona-btn text-left p-sm rounded-lg border border-outline-variant hover:border-primary-container transition flex items-start gap-sm min-h-[44px]" data-role="CLIENT" data-dest="/app/post-project.html?mode=civil">
              <span class="icon text-[20px] text-primary" aria-hidden="true">add</span>
              <div>
                <p class="text-body-sm font-bold text-on-surface" data-i18n="login.persona.hireTender">Civil Construction Tender</p>
                <p class="text-[12px] text-on-surface-variant" data-i18n="login.persona.hireTenderDesc">New building, full floor, major engineering RFQ</p>
              </div>
            </button>
            <button type="button" class="persona-btn text-left p-sm rounded-lg border border-outline-variant hover:border-primary-container transition flex items-start gap-sm min-h-[44px]" data-role="CLIENT" data-dest="/app/materials.html">
              <span class="icon text-[20px] text-primary" aria-hidden="true">shopping_cart</span>
              <div>
                <p class="text-body-sm font-bold text-on-surface" data-i18n="login.persona.hireMaterials">Buy Construction Materials</p>
                <p class="text-[12px] text-on-surface-variant" data-i18n="login.persona.hireMaterialsDesc">BSRM rod, cement, aggregate with 100% escrow</p>
              </div>
            </button>
          </div>
        </div>

        <!-- Underlying Role Inputs (Accessible to Form Submission & Screen Readers, visually unified) -->
        <fieldset class="sr-only" aria-hidden="true">
          <legend data-i18n="login.role.label">Account Role</legend>
          <input type="radio" name="role" id="role-client" value="CLIENT" />
          <input type="radio" name="role" id="role-contractor" value="CONTRACTOR" checked />
          <input type="radio" name="role" id="role-supplier" value="SUPPLIER" />
        </fieldset>
        <p class="mt-xs text-body-sm text-on-surface-variant text-center" data-i18n="login.role.hint">Only used when creating a new account. This cannot be changed later.</p>
      </details>

      <button id="send-btn" type="submit" class="btn-primary w-full">
        <span data-i18n="login.send">Send code</span>
        <span class="icon" aria-hidden="true">arrow_forward</span>
      </button>
    </form>

    <!-- Step 2: code -->
    <form id="code-form" class="mt-lg space-y-lg" novalidate hidden>
      <p id="sent-to" class="alert-info" role="status"></p>
      <div>
        <label for="code" class="field-label" data-i18n="login.code.label">6-digit code</label>
        <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9০-৯]{6}" maxlength="6" required
               class="field text-center tracking-[0.5em] text-h3" aria-describedby="code-error" />
        <p id="code-error" class="field-error" hidden></p>
      </div>
      <button id="verify-btn" type="submit" class="btn-primary w-full">
        <span data-i18n="login.verify">Verify and continue</span>
      </button>
      <div class="flex flex-wrap items-center justify-between gap-sm text-body-sm">
        <button id="change-btn" type="button" class="btn-ghost px-sm">
          <span class="icon text-[18px]" aria-hidden="true">arrow_back</span>
          <span data-i18n="login.changeNumber">Change number</span>
        </button>
        <button id="resend-btn" type="button" class="btn-ghost px-sm" disabled>
          <span class="icon text-[18px]" aria-hidden="true">schedule</span>
          <span id="resend-label"></span>
        </button>
      </div>
    </form>
  </div>
</main>
<!--#include footer -->
</body>
</html>
