name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  pre-flight-verification:
    name: 🛡️ Pre-Flight Test Battery
    runs-on: ubuntu-24.04   # pinned: "ubuntu-latest" moves to Ubuntu 26 on 2026-10-19; this is the image CI has been using
    
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # public/app is committed build output (the server ships it as-is), so a
      # source change without a rebuild must not merge. The build itself also
      # enforces the frontend guards (no CDN, no inline JS, icon subset fresh).
      - name: Frontend build is up to date
        run: |
          npm run build:frontend
          git status --porcelain -- public/app
          test -z "$(git status --porcelain -- public/app)" || { echo "::error::public/app is stale — run 'npm run build:frontend' and commit the result"; exit 1; }

      # Invariant gates: secrets, banned patterns, dependency CVEs, orphaned
      # tests, auth/idempotency on every route, money/identity/secret schema
      # rules, and index coverage of every hot query. Fails fast before tests.
      - name: QA gates (static, route policy, schema policy, query plans)
        env:
          JWT_SECRET: ci_pipeline_secure_jwt_secret_key_2026
          TREASURY_PHONE: "01700000000"
          MONGODB_URI: mongodb://localhost:27017/marketplace_test
        run: npm run qa:ci

      - name: Run Complete Diagnostic Test Suite
        env:
          MONGODB_URI: mongodb://localhost:27017/marketplace_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci_pipeline_secure_jwt_secret_key_2026
          BID_SEAL_SECRET: ci_pipeline_bid_seal_secret_key_2026
          TREASURY_PHONE: "01700000000"
          WEBAUTHN_ORIGIN: http://localhost:3000
          WEBAUTHN_RP_ID: localhost
        run: |
          npm test

  deploy-to-production:
    name: 🚀 AWS ECR & EKS Deployment
    needs: pre-flight-verification
    # Opt-in: set the repo variable DEPLOY_ENABLED=true once AWS creds + the EKS
    # kubeconfig step are actually wired up. Until then main stays green.
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04   # pinned: "ubuntu-latest" moves to Ubuntu 26 on 2026-10-19; this is the image CI has been using
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Docker Image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: build-bd-marketplace
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest

      - name: Update Kubernetes Kubeconfig
        uses: aws-actions/aws-eks-update-kubeconfig@v2
        with:
          cluster-name: marketplace-prod-cluster
          region: ap-southeast-1

      - name: Rollout Deployment to EKS
        run: |
          kubectl rollout restart deployment/build-bd-marketplace-api -n production
          kubectl rollout status deployment/build-bd-marketplace-api -n production --timeout=300s
